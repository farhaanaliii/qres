name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "qres/**"
      - "tests/**"
      - "setup.py"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "qres/**"
      - "tests/**"
      - "setup.py"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and install
        run: |
          pip install -e .
          pip install pytest

      - name: Smoke test
        run: |
          python -c "import qres; print('ok')"
          qres --help

      - name: Run test suite
        run: pytest -v tests/

